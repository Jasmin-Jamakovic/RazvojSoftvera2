name: edoktor_mobile
description: "eDoktor patient mobile app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  table_calendar: ^3.1.2
  webview_flutter: ^4.4.2
  signalr_netcore: ^1.4.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  pdf: ^3.11.1
  printing: ^5.13.0
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # Fonts embedded in generated PDFs (prescriptions, lab results) so č, ć, š, ž, đ render correctly.
  assets:
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
